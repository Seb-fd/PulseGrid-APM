name: PulseGrid APM CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Linter
        run: npm run lint
      - name: Run Typecheck
        run: npm run typecheck
      - name: Run Unit Tests & Check Coverage
        run: npm run test -- --run --coverage
      - name: Enforce zone.js ban
        run: |
          ! grep -r "from 'zone.js'" src/ || (echo "zone.js import detected" && exit 1)
          ! grep -q '"zone.js"' package.json || (echo "zone.js dependency detected" && exit 1)
      - name: Build Production Bundle
        run: npm run build
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E Tests
        run: npm run e2e
